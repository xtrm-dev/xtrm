name: pi-viewer tests

on:
  push:
    paths:
      - "packages/pi-viewer/**"
      - ".github/workflows/pi-viewer.yml"
  pull_request:
    paths:
      - "packages/pi-viewer/**"
      - ".github/workflows/pi-viewer.yml"

permissions:
  contents: read

concurrency:
  group: pi-viewer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/pi-viewer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/pi-viewer/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --no-fund

      # The package had 30 test files and no workflow: a server or composer regression could merge with
      # green CI, because the only unit job watched packages/xtrm-app (XTRM-1109, PR #512 review).
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The browser gates (scripts/*-check.mjs) stay out of CI on purpose: they need a tmux session with
      # the operator's own panes and a Chromium download. They run locally against a private server
      # (README, Checks).
      - name: Build
        run: npm run build
