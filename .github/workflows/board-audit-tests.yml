name: board-audit tests

on:
  push:
    paths:
      - "packages/board-audit/**"
      - ".xtrm/board-audit/**"
      - ".gitignore"
      - ".github/workflows/board-audit-tests.yml"
  pull_request:
    paths:
      - "packages/board-audit/**"
      - ".xtrm/board-audit/**"
      - ".gitignore"
      - ".github/workflows/board-audit-tests.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax
        run: |
          python -m py_compile packages/board-audit/board-audit-roundtrip.py
          python -m py_compile packages/board-audit/board-audit-flow.py
          python -m py_compile packages/board-audit/board-audit-transport.py
          python -m py_compile packages/board-audit/board-audit-pr.py

      - name: Shell syntax
        run: |
          bash -n packages/board-audit/board-audit
          bash -n packages/board-audit/board-audit-core
          bash -n packages/board-audit/board-audit-pr-adapter.sh

      - name: Board-audit artifact tracking boundary
        run: |
          if git check-ignore -q --no-index .xtrm/board-audit/exports/example.json; then
            echo ".xtrm/board-audit must be versionable" >&2
            exit 1
          fi
          git check-ignore -q --no-index .xtrm/runtime/example.json

      - name: Board-audit tests
        env:
          # doctor verifies usable GitHub authentication (gh auth status); the
          # runner's gh reads the token from this environment variable.
          GH_TOKEN: ${{ github.token }}
        run: python -m unittest discover -s packages/board-audit/tests -p 'test_*.py' -v
