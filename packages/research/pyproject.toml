[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xtrm-research"
version = "0.4.0"
description = "Workload-agnostic experimentation and evaluation platform: versioned data contracts over a generic run and observation model. System One research is the first application, not the schema boundary."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xtrm" }]
keywords = ["research", "experimentation", "evaluation", "system-one"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
# Stdlib plus a JSON Schema validator: the run contract is enforced by the
# schemas in src/xtrm_research/schemas/, not by hand-written Python checks.
dependencies = [
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Optional: the Jev backend talks to TypeSafe through this SDK. The package
# and its full test suite import and pass without it.
jev = ["typesafe-sdk>=0.6.0"]
# Optional: Evidence Gate local arms (XTRM-495/496) — CPU torch, the
# Qwen3-Reranker and bge embedding models, loaded from the local HF cache.
local = ["torch", "transformers>=4.51", "sentence-transformers"]
# Optional: the Evidence Gate dataset's web-query replay (XTRM-493).
web = ["ddgs"]

[project.scripts]
xtrm-research = "xtrm_research.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xtrm_research = [
  "py.typed",
  "schemas/*.json",
  "evidence_gate/prices.json",
]
