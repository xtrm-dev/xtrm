[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xtrm-research"
version = "0.1.0"
description = "Workload-agnostic experimentation and evaluation platform: versioned data contracts over a generic run and observation model. System One research is the first application, not the schema boundary."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xtrm" }]
keywords = ["research", "experimentation", "evaluation", "system-one"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
# Stdlib plus a JSON Schema validator: the run contract is enforced by the
# schemas in src/xtrm_research/schemas/, not by hand-written Python checks.
dependencies = [
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
xtrm-research = "xtrm_research.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xtrm_research = [
  "py.typed",
  "schemas/*.json",
]
