name: eval-weekly

# PR5a: run the labeled eval corpus weekly, publish the §3.9 report as an artifact and
# sticky-comment a summary on the long-lived eval tracking issue. Advisory measurement only —
# this workflow never enables auto-merge (canary policy is PR5b).

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      corpus_version:
        description: "Corpus version tag recorded in telemetry"
        required: false
        default: "dev"

permissions:
  contents: read
  issues: write

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/service-knowledge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (+ vaultctl)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run eval corpus
        id: eval
        run: |
          WEEK="$(date -u +%G-%V)"
          echo "week=${WEEK}" >> "$GITHUB_OUTPUT"
          service-knowledge eval run \
            --out .beads/eval-reports \
            --week "${WEEK}" \
            --corpus-version "${{ github.event.inputs.corpus_version || 'dev' }}"

      - name: Publish report artifact
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ steps.eval.outputs.week }}
          path: packages/service-knowledge/.beads/eval-reports/
          if-no-files-found: error

      - name: Sticky-comment summary on tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVAL_TRACKING_ISSUE: ${{ vars.EVAL_TRACKING_ISSUE || '0' }}
          WEEK: ${{ steps.eval.outputs.week }}
        run: |
          if [ "${EVAL_TRACKING_ISSUE}" = "0" ]; then
            echo "EVAL_TRACKING_ISSUE not set; skipping sticky comment."
            exit 0
          fi
          REPORT=".beads/eval-reports/${WEEK}.md"
          BODY="$(cat "${REPORT}")"
          gh issue comment "${EVAL_TRACKING_ISSUE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body "## eval report ${WEEK}

          ${BODY}

          _Full report + JSON sidecar attached as workflow artifact \`eval-report-${WEEK}\`._"
