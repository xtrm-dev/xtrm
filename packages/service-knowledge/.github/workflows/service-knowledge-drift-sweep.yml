# service-knowledge drift sweep — deterministic verifier gate (service-knowledge v0.4.0, PR2)
#
# TEMPLATE: GitHub Actions only reads `.github/workflows/` at a repo root, so this file ships
# inside the package as the canonical template. A consumer adopts it by copying it to their
# own `<repo>/.github/workflows/service-knowledge-drift-sweep.yml`.
#
# Flow (research §2.7 gate lattice — deterministic only, REVISION 3, no LLM critic):
#   1. reconcile.py generates each candidate SKILL to a temp path and runs the PR1 verifier
#      BEFORE any canonical write (gated_write). Only PASS / PASS_WITH_ADVISORIES write.
#   2. The verifier `--gate-mode` verdict is computed again over the reconciled tree to gate
#      the PR step: INVALID / CONFLICT / EVIDENCE_RACE fail the job (sticky comment, no PR);
#      INSUFFICIENT_EVIDENCE_HIGH_RISK opens a DRAFT PR labelled `do-not-merge`;
#      PASS / PASS_WITH_ADVISORIES open a normal PR (never auto-merged — canary policy is PR5b).
#   3. manifest.json + the Markdown evidence report are published as artifacts and the
#      `service-knowledge-verify` status check surfaces the verdict on the PR for human reviewers.
#
# Telemetry: every gate decision appends one `component=reconcile-gate` line to
# `.xtrm/state/service-knowledge/events.jsonl` (grep by component for the audit trail).

name: service-knowledge-drift-sweep

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write
  pull-requests: write
  checks: write

concurrency:
  group: service-knowledge-drift-sweep
  cancel-in-progress: false

jobs:
  reconcile-and-verify:
    runs-on: ubuntu-latest
    outputs:
      gate: ${{ steps.gate.outputs.verdict }}
      exit_code: ${{ steps.gate.outputs.exit_code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install service-knowledge
        run: pip install service-knowledge

      - name: Reconcile drift (candidates gated before write)
        env:
          NANO_GPT_API_KEY: ${{ secrets.NANO_GPT_API_KEY }}
          XTRM_AUTO_RECONCILE_COST_LIMIT_TOKENS: "200000"
        run: |
          python3 -m service_knowledge.scripts.reconcile --json > reconcile-output.json || true
          cat reconcile-output.json

      - name: Verify reconciled tree (gate verdict)
        id: gate
        run: |
          # Run the verifier gate over each reconciled SKILL; emit manifest.json + report.md.
          # --gate-mode exits non-zero on INVALID / CONFLICT / EVIDENCE_RACE.
          python3 -m service_knowledge.scripts.verifier \
            --candidate "$SKILL_CANDIDATE" --current "$SKILL_CURRENT" \
            --territory 'source/**' --gate-mode --output-format json > manifest.json \
            && python3 -m service_knowledge.scripts.verifier \
                 --candidate "$SKILL_CANDIDATE" --current "$SKILL_CURRENT" \
                 --territory 'source/**' --gate-mode --output-format markdown > report.md
          verdict=$(python3 -c "import json;print(json.load(open('manifest.json'))['gate']['verdict'])")
          exit_code=$(python3 -c "import json;print(json.load(open('manifest.json'))['gate']['exit_code'])")
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          echo "Gate verdict: $verdict (exit_code=$exit_code)"

      - name: Publish verification report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-knowledge-verify
          path: |
            manifest.json
            report.md
            reconcile-output.json
            .xtrm/state/service-knowledge/events.jsonl
          if-no-files-found: warn

      - name: service-knowledge-verify (status check)
        if: always()
        uses: LouisBrunner/checks-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: service-knowledge-verify
          status: completed
          conclusion: ${{ steps.gate.outputs.exit_code == '0' && 'success' || 'failure' }}
          output: |
            {"summary":"Gate verdict: ${{ steps.gate.outputs.verdict }}. See the service-knowledge-verify artifact for the per-claim manifest + evidence report."}

      - name: Sticky comment on blocking verdict (no PR)
        if: steps.gate.outputs.exit_code != '0'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: service-knowledge-verify
          message: |
            ## ❌ service-knowledge verifier gate: `${{ steps.gate.outputs.verdict }}`

            The deterministic verifier blocked this sweep — **no PR was opened**.
            See the `service-knowledge-verify` artifact (`manifest.json` / `report.md`) for the
            per-claim verdicts, evidence paths and complete-set comparisons.

      - name: Fail job on INVALID / CONFLICT / EVIDENCE_RACE
        if: steps.gate.outputs.exit_code != '0'
        run: |
          echo "::error::verifier gate blocked: ${{ steps.gate.outputs.verdict }}"
          exit 1

      - name: Open PR (draft on INSUFFICIENT_EVIDENCE_HIGH_RISK, normal otherwise)
        if: steps.gate.outputs.exit_code == '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(service-knowledge): reconcile service SKILL drift (gate=${{ steps.gate.outputs.verdict }})"
          branch: service-knowledge-drift-sweep
          title: "chore(service-knowledge): reconcile service SKILL drift [${{ steps.gate.outputs.verdict }}]"
          draft: ${{ steps.gate.outputs.verdict == 'INSUFFICIENT_EVIDENCE_HIGH_RISK' }}
          labels: |
            service-knowledge
            ${{ steps.gate.outputs.verdict == 'INSUFFICIENT_EVIDENCE_HIGH_RISK' && 'do-not-merge' || '' }}
          body-path: report.md
