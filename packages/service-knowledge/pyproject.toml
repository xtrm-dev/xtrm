[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "service-knowledge"
version = "0.8.0"
description = "First-class operational service-knowledge package: per-service expert skill packages kept in sync with code via a GitNexus-aware drift engine. Own CLI, own lifecycle."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xtrm" }]
keywords = ["service-knowledge", "skills", "drift", "gitnexus", "devops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
]
# vaultctl is the ONLY cross-package dependency. It lives in its own sibling
# repo (github.com/xtrm-dev/vaultctl) and is NOT published to PyPI, so it is
# NOT listed here — declaring it would break `pipx install --editable .`.
# Consumers get it via `install.sh` (pipx inject --editable), which is the
# supported installer path. Manual pipx users: `pipx inject --editable
# service-knowledge /path/to/vaultctl` after `pipx install --editable .`.
# The CLI itself is stdlib-only and must NOT depend on xtrm/sp/xt/xtmux.
dependencies = [
  "jsonschema>=4.0",
  "markdown-it-py>=4.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
service-knowledge = "service_knowledge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
service_knowledge = [
  "py.typed",
  "scripts/*.py",
  "scripts/*.sh",
  "scripts/coverage_audit/*.md",
  "scripts/coverage_audit/*.mjs",
  "scripts/coverage_audit/workflows/*.mjs",
  "contracts/*.json",
  "skills/*.md",
  "install/*.py",
  "install/*.json",
  "install/*.md",
  "install/git-hooks/*.py",
]
